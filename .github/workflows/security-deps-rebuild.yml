name: Resolve Go security dependency updates

on:
  push:
    branches: ['security/harden-windows-v1']
    paths: ['.github/workflows/security-deps-rebuild.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-go-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - name: Upgrade vulnerable Go modules
        working-directory: native
        run: |
          set -euo pipefail
          go get github.com/cloudflare/circl@v1.6.3 golang.org/x/net@v0.55.0 golang.org/x/text@v0.39.0
          go mod tidy
          go mod verify
      - name: Commit pinned dependency repairs to security branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/go.mod native/go.sum
          if ! git diff --cached --quiet; then
            git commit -m "security: pin patched Go dependencies"
            git push origin HEAD:security/harden-windows-v1
          fi
      - name: Run Go tests with patched dependencies
        id: patched_tests
        continue-on-error: true
        working-directory: native
        run: go test ./...
      - name: Upload reviewed module lockfiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-security-lockfiles
          path: |
            native/go.mod
            native/go.sum
          if-no-files-found: error
          retention-days: 7
      - name: Keep failed Go tests as a blocking result
        if: steps.patched_tests.outcome == 'failure'
        run: |
          echo "::error::Patched dependency lockfiles were captured, but Go tests failed."
          exit 1
