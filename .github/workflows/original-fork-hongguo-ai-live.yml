name: Original fork Hongguo AI live parity
on:
  push:
    branches:
      - diagnostics/hongguo-original-fork-20261024
    paths:
      - native/core/original_fork_hongguo_ai_live_test.go
      - .github/workflows/original-fork-hongguo-ai-live.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-fork-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: native/go.sum
      - name: Run unchanged original fork against public Hongguo AI endpoint and playback
        working-directory: native
        run: go test ./core -run '^TestOriginalForkHongguoAILiveParity$' -count=1 -v -timeout 3m
