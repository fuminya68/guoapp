name: Hongguo Android TLS transport differential
on:
  push:
    branches:
      - diagnostics/hongguo-tls-transport-20261024
    paths:
      - native/core/hongguo_app_tls_transport_test.go
      - .github/workflows/hongguo-app-tls-parity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprint-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: native/go.sum
      - name: Compare identical signed Hongguo requests with original Go and Android-like TLS
        working-directory: native
        run: go test ./core -run '^TestHongguoAppTLSTransportFingerprintComparison$' -v -count=1 -timeout 4m
