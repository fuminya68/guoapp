name: FFmpeg 8.1.3 real conversion test

on:
  push:
    branches: ['security/ffmpeg-8.1.3']
    paths: ['.github/workflows/ffmpeg813-transcode.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  ffmpegkit-conversion:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: zhenguojian-windows-x64-hardened
          run-id: 39939208001
          github-token: ${{ github.token }}
          path: baseline
      - name: Prepare upgrade over verified baseline ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem baseline -Filter 'zhenguojian-0.2.64+71-windows-x64.zip' -File | Select-Object -First 1
          if (-not $zip -or (Get-FileHash $zip.FullName -Algorithm SHA256).Hash -ne 'F9A119463529061D5BCD55CA6FBB6130CC10307F1871C42C753613D6FF78946A') {
            throw 'Baseline hash mismatch'
          }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath checked-baseline -Force
          python scripts/prepare_ffmpeg813_windows.py --output prepared --evidence evidence
          if ($LASTEXITCODE -ne 0) { throw 'Unable to stage patched FFmpeg libraries' }
          foreach ($name in @('avcodec-62.dll','avdevice-62.dll','avfilter-11.dll','avformat-62.dll','avutil-60.dll','swresample-6.dll','swscale-9.dll')) {
            Copy-Item -LiteralPath (Join-Path 'prepared/bin' $name) -Destination (Join-Path 'checked-baseline' $name) -Force
          }
      - name: Actual FFmpegKit audio transcode using new FFmpeg libraries
        shell: pwsh
        run: |
          @'
          import ctypes, json, os, pathlib, wave
          folder=pathlib.Path('checked-baseline').resolve()
          work=pathlib.Path('transcode-fixture').resolve()
          work.mkdir(exist_ok=True)
          incoming=work/'input.wav'
          outgoing=work/'output.wav'
          with wave.open(str(incoming),'wb') as f:
              f.setnchannels(1)
              f.setsampwidth(2)
              f.setframerate(8000)
              f.writeframes(bytes(16000))
          with os.add_dll_directory(str(folder)):
              library=ctypes.WinDLL(str(folder/'libffmpegkit.dll'))
              create=library.ffmpegkit_create_ffmpeg_session
              create.argtypes=[ctypes.POINTER(ctypes.c_char_p),ctypes.c_int]
              create.restype=ctypes.c_void_p
              execute=library.ffmpegkit_ffmpeg_execute
              execute.argtypes=[ctypes.c_long]
              execute.restype=None
              get_code=library.ffmpegkit_session_get_return_code
              get_code.argtypes=[ctypes.c_long]
              get_code.restype=ctypes.c_int
              release=library.ffmpegkit_free
              release.argtypes=[ctypes.c_void_p]
              release.restype=None
              args=['-hide_banner','-nostdin','-y','-i',str(incoming),'-c:a','pcm_s16le',str(outgoing)]
              data=(ctypes.c_char_p*len(args))(*(s.encode('utf-8') for s in args))
              result=create(data,len(args))
              if not result:
                  raise RuntimeError('FFmpegKit did not create session')
              try:
                  text=ctypes.string_at(result).decode('utf-8')
              finally:
                  release(result)
              session=json.loads(text)
              print('FFmpegKit session JSON keys:',sorted(session),flush=True)
              sid=session.get('sessionId')
              if sid is None:
                  raise RuntimeError('FFmpegKit session lacks sessionId: '+text[:1000])
              execute(sid)
              rc=get_code(sid)
              print('Actual FFmpegKit FFmpeg command returned:',rc,flush=True)
              if rc!=0 or not outgoing.exists() or outgoing.stat().st_size<100:
                  raise RuntimeError('Patched FFmpeg did not convert synthetic WAV')
              with wave.open(str(outgoing),'rb') as f:
                  assert f.getnchannels()==1 and f.getframerate()==8000 and f.getnframes()>=8000
              print('PASS: native FFmpegKit wrapper transcoded synthetic PCM WAV using FFmpeg 8.1.3 DLLs')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'FFmpegKit native conversion test failed' }
