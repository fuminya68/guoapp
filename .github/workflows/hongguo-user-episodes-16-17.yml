name: Hongguo user episode 16/17 site parity
on:
  push:
    branches:
      - diagnostics/hongguo-user-episode16-17-20261024
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: native/go.sum
      - name: Compare user-provided episode URLs and public catalog video IDs
        working-directory: native
        run: go test ./core -run '^TestHongguoUserEpisode16And17SiteParity$' -count=1 -v -timeout 2m
