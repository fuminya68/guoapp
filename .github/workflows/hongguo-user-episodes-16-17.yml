name: Hongguo access boundary metadata check
on:
  push:
    branches:
      - diagnostics/hongguo-user-episode16-17-20261024
  workflow_dispatch:
permissions:
  contents: read
jobs:
  access-flags:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: native/go.sum
      - name: Read public access metadata without any user credentials
        working-directory: native
        run: go test ./core -run TestHongguoServerDeclaredAccessibleEpisodeCount -count=1 -v -timeout 3m
