name: Huangguo AI per-drama episode identity tests
on:
  push:
    branches:
      - security/huangguo-episode-identity-20261024
    paths:
      - native/core/provider_huangguo.go
      - native/core/provider_huangguo_episode_identity_test.go
      - native/core/huangguo_ai_real_ownership_test.go
      - .github/workflows/huangguo-ai-episode-identity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: native/go.sum
      - name: Reject global hot search videos as unrelated drama episodes
        working-directory: native
        run: go test ./core -run TestHuangguoAIEpisodeParserRejectsGlobalHotAndRelatedTitles -count=1 -v
      - name: Never substitute episode one for a missing episode
        working-directory: native
        run: go test ./core -run TestHuangguoAIInitialDataDoesNotBorrowAnotherEpisode -count=1 -v
      - name: Confirm real separate episodes for the reported dramas
        working-directory: native
        run: go test ./core -run TestHuangguoAIRealEpisodeOwnershipLive -count=1 -v -timeout 3m
