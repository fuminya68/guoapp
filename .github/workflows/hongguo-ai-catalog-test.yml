name: Hongguo AI catalogue fallback regression
on:
  push:
    branches:
      - security/hongguo-ai-catalog-repair
    paths:
      - .github/workflows/hongguo-ai-catalog-test.yml
      - native/core/provider_hongguo_fallback.go
      - native/core/provider_hongguo_fallback_test.go
      - native/core/provider_hongguo_app.go
      - native/core/app_runtime.go
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: native/go.sum
      - name: Test Hongguo category recovery with fixed offline fixtures
        working-directory: native
        run: |
          set -euo pipefail
          go test ./core -run '^Test(HongguoWebCategory|RecoverHongguo)' -count=1 -v
