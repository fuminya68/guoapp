name: Hongguo AI episode 6 access metadata parity
on:
  push:
    branches:
      - diagnostics/hongguo-ai-episode6-access-20261024
  workflow_dispatch:
permissions:
  contents: read
jobs:
  access-flags:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: native/go.sum
      - name: Compare same-series episodes 1-15 website access flags
        working-directory: native
        run: go test ./core -run '^TestHongguoFirstTenEpisodesBrowserAvailability$' -count=1 -v -timeout 3m
