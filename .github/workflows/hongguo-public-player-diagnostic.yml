name: Hongguo public quickapp AI endpoint diagnostic
on:
  push:
    branches:
      - diagnostics/hongguo-public-player-20261024
    paths:
      - native/core/hongguo_public_quickapp_test.go
      - .github/workflows/hongguo-public-player-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: native/go.sum
      - name: Check exact AI drama episode in public quickapp HTML
        working-directory: native
        run: go test ./core -run '^TestHongguoPublicPlayerEndpointAI$' -count=1 -v -timeout 2m
