name: Taiwan UI and Hongguo safe fallback smoke
on:
  push:
    branches:
      - security/hongguo-verified-fallback-20261024
      - security/hongguo-public-episode-fallback-20261024
    paths:
      - .github/workflows/hongguo-ui-fallback-tests.yml
      - lib/hongguo_web_fallback.dart
      - lib/player_screen.dart
      - lib/download_picker.dart
      - lib/detail_screen.dart
      - lib/playback_preferences.dart
      - test/hongguo_web_fallback_test.dart
      - test/playback_volume_test.dart
      - test/downloads_test.dart
      - native/core/provider_hongguo.go
      - native/core/provider_hongguo_protected_playback_test.go
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-widget-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Test safe public Hongguo deep link and volume persistence
        run: flutter test test/hongguo_web_fallback_test.dart test/playback_volume_test.dart --dart-define=ALL_SOURCES=true --dart-define=DISABLE_REMOTE_IMAGES=true
      - name: Test Traditional Chinese download picker selection
        run: flutter test test/downloads_test.dart --plain-name 'detail download picker handles VIP, quality' --dart-define=ALL_SOURCES=true --dart-define=DISABLE_REMOTE_IMAGES=true

  hongguo-protected-playback:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: native/go.sum
      - name: Reject raw media for protected browser playback without claiming login
        working-directory: native
        run: go test ./core -run '^TestHongguoWebProtectedPlaybackStatus$' -count=1 -v
