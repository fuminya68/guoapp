name: Hongguo AI live stream verification
on:
  push:
    branches:
      - security/tw-volume-hongguo-live-20261024
    paths:
      - native/core/hongguo_ai_live_verification_test.go
      - .github/workflows/hongguo-ai-live-verification.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-ai-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: native/go.sum
      - name: Verify live AI catalogue, episodes and incoming media bytes
        working-directory: native
        run: go test ./core -run '^TestHongguoAILiveCatalogDetailAndMedia$' -count=1 -v -timeout 3m
